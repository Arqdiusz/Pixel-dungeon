<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Przygody giermka</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#e4e9f1;font:14px system-ui}button{font:inherit;color:inherit;background:#263650;border:1px solid #53647e;border-radius:9px;padding:10px;cursor:pointer}button:hover{background:#354969}#app{display:grid;grid-template-columns:2fr 1fr;height:100dvh}main{display:flex;flex-direction:column;min-width:0;padding:12px}#svg{width:100%;flex:1;min-height:0;background:#111c29}aside{overflow:auto;padding:18px;background:#151f30}#preview{width:140px;height:180px;background:#243047;border-radius:12px}#eq,#gear{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}#attacks{display:grid;gap:6px}.controls{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#172338}.positive{color:#61dc99}.negative{color:#ff8585}small{color:#a5b4ca}#overlay{position:fixed;inset:0;background:#101a2bf5;display:grid;place-content:center;text-align:center;gap:15px}#dialog{max-width:420px;background:#18263a;color:white;border:1px solid #71809b;border-radius:14px}#msg{min-height:40px;padding:10px}h3{color:#a9b9d0} @media(max-width:700px){#app{grid-template-columns:1fr;height:auto}main{height:65dvh}aside{overflow:visible}button{min-height:44px}}
</style></head><body>
<div id="app"><main><div id="status"></div><svg id="svg" viewBox="0 0 640 360" aria-label="Plansza"></svg><div id="msg"></div><div class="controls"><button onclick="move(0,-1)">↑</button><button onclick="move(-1,0)">←</button><button onclick="move(0,1)">↓</button><button onclick="move(1,0)">→</button><button onclick="endTurn()">Czekaj [E]</button><button onclick="save();menu()">Menu</button></div></main><aside><h2>Giermek</h2><svg id="preview" viewBox="0 0 32 32"></svg><div id="stats"></div><h3>Założone wyposażenie</h3><div id="gear"></div><h3>Ataki — wybierz cel na planszy</h3><div id="attacks"></div><p><small>WASD/strzałki: ruch · 1/2/3: wybór ataku · Tab: cel · Enter: atak · E: czekaj</small></p><h3 id="bagTitle">Plecak</h3><div id="eq"></div></aside></div>
<div id="overlay"></div><dialog id="dialog"></dialog>
<script>
'use strict';
const T=32, svg=document.getElementById('svg'), preview=document.getElementById('preview');
const key='giermek-demo-v8';let player=null,enemies=[],walls=[],drops=[],level=1,moved=false,selected=null,attackType=0,playing=false;
const names={hp:'HP',stamina:'Stamina',sila:'Siła',magia:'Moc'};
const slots={helm:'Głowa',armor:'Tors',pants:'Spodnie',weapon:'Prawa ręka',left:'Lewa ręka',ring:'Pierścień',backpack:'Torba'};
const random=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function item(slot,name){const k=Object.keys(names)[random(0,3)];return{slot,name,stats:{[k]:random(-1,2)}}}
function total(k){return player.base[k]+Object.values(player.equip).reduce((n,i)=>n+(i?.stats?.[k]||0),0)}
function cap(){return 8+(player.equip.backpack?.capacity||0)}
function say(t){document.getElementById('msg').textContent=t}
function save(){if(!player)return;try{localStorage.setItem(key,JSON.stringify({player,enemies,walls,drops,level,moved}))}catch(e){say('Zapis niedostępny w tej przeglądarce.')}}
function menu(){playing=false;const o=document.getElementById('overlay');o.style.display='grid';o.innerHTML='<h1>Przygody giermka</h1><p>Nowa przygoda wojownika</p><button onclick="start()">Nowa gra</button><button onclick="load()">Kontynuuj</button>';}
function start(){player={x:2,y:4,hp:120,sta:100,base:{hp:120,stamina:100,sila:12,magia:3},equip:{weapon:item('weapon','Wyszczerbiony miecz'),armor:item('armor','Łatany kaftan'),pants:item('pants','Znoszone spodnie')},inventory:[{name:'Mikstura HP',potion:'hp'},{name:'Mikstura staminy',potion:'sta'},{name:'Mikstura mocy',potion:'power'}],power:20};level=1;newMap();resume();}
function resume(){playing=true;document.getElementById('overlay').style.display='none';render();save()}
function load(){try{const d=JSON.parse(localStorage.getItem(key));if(!d)throw Error();({player,enemies,walls,drops,level,moved}=d);resume()}catch(e){alert('Brak zgodnego zapisu tej wersji. Rozpocznij nową grę.')}}
function wall(x,y){return x<1||x>18||y<1||y>8||walls.some(w=>w.x===x&&w.y===y)}
function occupied(x,y){return enemies.some(e=>e.x===x&&e.y===y)}
function newMap(){player.x=2;player.y=4;moved=false;selected=null;walls=[{x:7,y:2},{x:7,y:3},{x:7,y:5},{x:7,y:6},{x:12,y:4},{x:12,y:5}];enemies=Array.from({length:level+2},(_,i)=>({x:14+i%3,y:1+i,hp:24+level*6}));drops=[];}
function enemyActions(){for(const e of enemies){if(Math.abs(e.x-player.x)+Math.abs(e.y-player.y)===1){player.hp-=6+level;continue}const options=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>!wall(p.x,p.y)&&!occupied(p.x,p.y)&&!(p.x===player.x&&p.y===player.y)).sort((a,b)=>(Math.abs(a.x-player.x)+Math.abs(a.y-player.y))-(Math.abs(b.x-player.x)+Math.abs(b.y-player.y)));if(options.length&&Math.abs(options[0].x-player.x)+Math.abs(options[0].y-player.y)<Math.abs(e.x-player.x)+Math.abs(e.y-player.y))Object.assign(e,options[0]);}player.sta=Math.min(total('stamina'),player.sta+6);player.power=Math.min(20,player.power+2);if(player.hp<=0){player.hp=0;playing=false;menu();say('Giermek poległ.')} }
function move(dx,dy){if(!playing)return;let x=player.x+dx,y=player.y+dy;if(wall(x,y)){say('Droga zablokowana.');return}if(moved){enemyActions();if(!playing)return;}if(occupied(x,y)){moved=false;render();save();say('Wróg zajął pole. Wybierz inną akcję.');return}player.x=x;player.y=y;moved=true;for(let i=drops.length-1;i>=0;i--)if(drops[i].x===x&&drops[i].y===y&&player.inventory.length<cap()){player.inventory.push(drops[i].item);drops.splice(i,1)}if(!enemies.length&&x===18&&y===4){if(level===3){menu();say('Zwycięstwo!');return}level++;newMap()}say('Możesz zaatakować lub ruszyć dalej — wtedy najpierw zadziałają wrogowie.');render();save()}
function endTurn(){if(!playing)return;enemyActions();moved=false;render();save()}
function damage(){const b=Math.max(1,total('sila'));return[[b,Math.ceil(b*1.4)],[b*2,b*3],[b*2+3,b*3+5]]}
function attack(i){if(!playing)return;attackType=i;say('Kliknij wroga, następnie Enter lub przycisk ataku ponownie.');if(selected&&enemies.includes(selected)){const range=i===2?2:1;if(Math.abs(selected.x-player.x)+Math.abs(selected.y-player.y)>range){say('Cel poza zasięgiem.');return}const cost=[10,25,35][i];if(player.sta<cost){say('Za mało staminy.');return}player.sta-=cost;const [a,b]=damage()[i];const n=random(a,b);selected.hp-=n;say('Zadano '+n+' obrażeń.');if(selected.hp<=0){const slot=Object.keys(slots)[random(0,6)];const loot=Math.random()<0.05?{slot:'backpack',name:'Torba podróżna',stats:{},capacity:4}:item(slot==='backpack'?'armor':slot,'Zdobyty przedmiot');drops.push({x:selected.x,y:selected.y,item:loot});enemies=enemies.filter(e=>e!==selected);selected=null}endTurn()}render()}
function el(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)n.setAttribute(k,attrs[k]);return n}
function drawPlayer(){svg.appendChild(el('circle',{cx:player.x*T+16,cy:44+player.y*T+16,r:11,fill:'#77baff'}))}
function drawPreview(){preview.innerHTML='<circle cx="16" cy="16" r="10" fill="#77baff"/>'}
function render(){if(!player)return;svg.replaceChildren();for(let y=0;y<10;y++)for(let x=0;x<20;x++)svg.appendChild(el('rect',{x:x*T,y:44+y*T,width:T,height:T,fill:wall(x,y)?'#3c4e60':(x+y)%2?'#1c2e39':'#20333e'}));if(!enemies.length)svg.appendChild(el('rect',{x:18*T+4,y:44+4*T+4,width:24,height:24,fill:'#e8bd62'}));for(const d of drops)svg.appendChild(el('circle',{cx:d.x*T+16,cy:44+d.y*T+16,r:5,fill:'#d9acff'}));for(const e of enemies){const g=el('g',{style:'cursor:pointer'});g.appendChild(el('circle',{cx:e.x*T+16,cy:44+e.y*T+16,r:12,fill:e===selected?'#ffd371':'#91af5e',stroke:'#152113','stroke-width':2}));g.onclick=()=>{selected=e;say('Cel: '+e.hp+' HP. Wybierz atak 1/2/3.');render()};svg.appendChild(g)}drawPlayer();drawPreview();document.getElementById('status').textContent='Kraina '+level+' • HP '+player.hp+'/'+total('hp')+' • STA '+player.sta+'/'+total('stamina');document.getElementById('stats').innerHTML=Object.entries(names).map(([k,n])=>{const bonus=total(k)-player.base[k];const tip=Object.values(player.equip).filter(i=>i?.stats?.[k]).map(i=>i.name+': '+i.stats[k]).join(', ');return n+': '+total(k)+' ('+player.base[k]+' <span class="'+(bonus<0?'negative':'positive')+'" title="'+tip+'">'+(bonus>=0?'+':'')+bonus+'</span>)'}).join('<br>')+'<br><small>Regeneracja: +6 STA i +2 mocy na turę wrogów.</small>';document.getElementById('attacks').innerHTML=damage().map(([a,b],i)=>'<button onclick="attack('+i+')">'+(i+1)+'. '+['Lekki','Silny','Specjalny'][i]+' • '+a+'–'+b+' obrażeń • '+[10,25,35][i]+' STA</button>').join('');document.getElementById('gear').innerHTML=Object.entries(slots).map(([s,n])=>'<button onclick="unequip(''+s+'')">'+n+': '+(player.equip[s]?.name||'—')+'</button>').join('');document.getElementById('bagTitle').textContent='Plecak '+player.inventory.length+'/'+cap();document.getElementById('eq').innerHTML=player.inventory.map((it,i)=>'<button onclick="inspect('+i+')">'+it.name+'</button>').join('');}
function inspect(i){const it=player.inventory[i],d=document.getElementById('dialog');d.innerHTML='<h3>'+it.name+'</h3><p>'+Object.entries(it.stats||{}).map(([k,v])=>names[k]+': '+(v>0?'+':'')+v).join(' · ')+'</p><button onclick="equip('+i+')">'+(it.potion?'Użyj':'Załóż')+'</button> <button onclick="destroy('+i+')">Zniszcz</button> <button disabled>Rozłóż — wkrótce</button> <button onclick="this.closest('dialog').close()">Zamknij</button>';d.showModal()}
function equip(i){if(!playing)return;const it=player.inventory[i];if(it.potion){if(it.potion==='hp')player.hp=Math.min(total('hp'),player.hp+30);if(it.potion==='sta')player.sta=Math.min(total('stamina'),player.sta+40);if(it.potion==='power')player.power=Math.min(20,player.power+15);player.inventory.splice(i,1)}else{const old=player.equip[it.slot];const capacity=it.slot==='backpack'?8+(it.capacity||0):cap();if(player.inventory.length-1+(old?1:0)>capacity){alert('Za mała torba.');return}player.inventory.splice(i,1);player.equip[it.slot]=it;if(old)player.inventory.push(old)}player.hp=Math.min(player.hp,total('hp'));player.sta=Math.min(player.sta,total('stamina'));document.getElementById('dialog').close();render();save()}
function unequip(s){if(!playing||!player.equip[s])return;const capacity=s==='backpack'?8:cap();if(player.inventory.length+1>capacity){say('Brak miejsca na zdjęcie przedmiotu.');return}player.inventory.push(player.equip[s]);delete player.equip[s];player.hp=Math.min(player.hp,total('hp'));player.sta=Math.min(player.sta,total('stamina'));render();save()}
function destroy(i){player.inventory.splice(i,1);document.getElementById('dialog').close();render();save()}
document.addEventListener('keydown',e=>{if(!playing||document.getElementById('dialog').open)return;const k=e.key.toLowerCase();const dirs={w:[0,-1],arrowup:[0,-1],s:[0,1],arrowdown:[0,1],a:[-1,0],arrowleft:[-1,0],d:[1,0],arrowright:[1,0]};if(dirs[k]){e.preventDefault();if(!e.repeat)move(...dirs[k])}if(['1','2','3'].includes(k))attack(Number(k)-1);if(k==='e')endTurn();if(k==='tab'){e.preventDefault();selected=enemies[(enemies.indexOf(selected)+1)%enemies.length];render()}if(k==='enter'&&selected)attack(attackType)});menu();
</script>
<script src="./assets/js/giermek.js?v=1"></script>
</body></html>
